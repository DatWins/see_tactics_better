<style>
/* See Tactics Better — green board palette */
:root {
    --cover-text-color:#ddeee3;
    --cover-title-and-description-guard-bg-color: rgba(10,26,14,.65);
    --cover-title-text-shadow: none;

    --highlight:#ddeee3;
    --highlight-contrast:#1a2e1e;
    --highlight-inverse:#4a7c59;
    --highlight-inverse-contrast:#eef2ee;

    --sticky-menu-text-color:#7ab893;

    --section-light-bg-color:#ddeee3;
    --section-light-text-color:#1a2e1e;
    --section-dark-bg-color:#1a2e1e!important;
    --section-dark-text-color:#eef2ee!important;
    --section-uni-quote:#4a7c59;
    --section-uni-code-bg-color:#c4dece;

    --footer-color-background:#0f1f13;
    --footer-color:#7ab893;

    --ul-li-icon: ;
}
.blog-title, .blog-description { color:#ddeee3 !important; }
.title-and-description-guard { border:1px solid rgba(74,124,89,.55); }
#site-head .btn.site-menu { border:none; }
.post-content a { text-decoration-color:#4a7c59; text-underline-offset:3px; }
.post-content a:hover { color:#2f6b3a; }
.post-holder.dark .post-content a:hover { color:#9cc9a3; }
.fixed-nav a.fn-item.active { color:#4a7c59; }
.post-content h2 { font-size: 1.9em; margin-top: 1.6em; scroll-margin-top: 72px; }
.post-title { margin-bottom: 0.4em; }
[id$="-theme"] { display: none; }

/* sub menu: categories within a group */
.submenu { display:flex; flex-wrap:wrap; gap:8px; margin:1.1em 0 1.6em; }
.submenu .sub-item { display:inline-block; padding:7px 14px; border-radius:999px; font-size:.82em; line-height:1.3;
  text-decoration:none !important; border:1.5px solid #1a2e1e; }
.submenu .ready { background:#1a2e1e; color:#eef2ee !important; }
.submenu .ready:hover, .submenu .ready:focus-visible { background:#4a7c59; border-color:#4a7c59; color:#eef2ee !important; }
.submenu .ready:focus-visible { outline:3px solid #4a7c59; outline-offset:2px; }
.submenu .soon { color:#1a2e1e; opacity:.5; border-style:dashed; cursor:default; }
.post-holder.dark .submenu .sub-item { border-color:#eef2ee; }
.post-holder.dark .submenu .ready { background:#ddeee3; color:#1a2e1e !important; }
.post-holder.dark .submenu .soon { color:#ddeee3; }

#site-head .btn.site-menu, .fixed-nav a.fn-item { text-transform:none !important; letter-spacing:.02em; }
#site-head .btn.site-menu { font-size:1.05em; }

@media only screen and (max-width: 1130px) {
  .fixed-nav {
    flex-wrap: nowrap !important; justify-content: flex-start; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 8px 10px !important; background: #1a2e1e !important; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    box-sizing: border-box;
  }
  .fixed-nav::-webkit-scrollbar { display: none; }
  a.fn-item {
    display: inline-block !important; flex: 0 0 auto; margin: 0 !important;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    font-size: 15px; line-height: 1.2; letter-spacing: .02em;
    color: #ddeee3 !important; background: rgba(221,238,227,.12); opacity: .9;
  }
  a.fn-item.active { background: #ddeee3; color: #1a2e1e !important; opacity: 1; }
  .post-holder .post { scroll-margin-top: 64px; }
  #site-head .btn.site-menu { padding: 10px 16px; margin: 5px 3px; font-size: 15px; }
  #site-head .blog-title { font-size: 3.4rem; }
  #site-head .blog-description { font-size: 1.9rem; }
  .submenu { gap:7px; }
  .submenu .sub-item { padding:8px 13px; font-size:14px; }
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.fixed-nav'); if (!nav) return; var last = null;
  window.addEventListener('scroll', function () {
    var a = nav.querySelector('.fn-item.active'); if (!a || a === last || nav.scrollWidth <= nav.clientWidth) return; last = a;
    nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
  }, { passive: true });
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
